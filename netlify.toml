# Variabili Firebase (VITE_* o FIREBASE_* o NEXT_PUBLIC_* nel merge vite.config) devono essere
# definite in Netlify → Environment variables e disponibili al build, altrimenti auth resta disattiva.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
