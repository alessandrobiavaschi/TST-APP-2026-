<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistema Solare delle Emozioni</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d12;
    --bg2: #13131a;
    --border: rgba(255,255,255,0.07);
    --text: #e8e4da;
    --muted: #6b6870;
    --sun: #EF9F27;
    --sun-glow: rgba(239,159,39,0.15);
    --accent: #AFA9EC;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--text);
    margin-bottom: 0.3rem;
    text-align: center;
  }
  .subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    text-align: center;
  }

  #editor-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.6rem;
    width: 100%;
    max-width: 560px;
    margin-bottom: 2.5rem;
  }
  #editor-panel h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 1rem;
    text-transform: uppercase;
    font-size: 0.72rem;
  }
  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }
  .field-row {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .field-row label {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .field-row input {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.45rem 0.7rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .field-row input:focus {
    border-color: var(--accent);
  }
  .btn-update {
    margin-top: 1.1rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.55rem 1.4rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn-update:hover { background: var(--accent); color: var(--bg); }

  /* SVG container */
  #solar-wrap {
    width: 100%;
    max-width: 580px;
    position: relative;
  }
  #solar-svg { width: 100%; display: block; }

  .orbit { fill:none; stroke: rgba(255,255,255,0.08); stroke-width:0.8; stroke-dasharray:3,6; }
  .planet-g { cursor: pointer; }
  .planet-g .p-outer { transition: opacity 0.2s; }
  .planet-g:hover .p-outer { opacity: 0.75; }
  .plabel {
    font-family: 'DM Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-anchor: middle;
    pointer-events: none;
    fill: inherit;
  }
  .other-item {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-style: italic;
    text-anchor: middle;
    fill: #b8b4c8;
    transition: opacity 0.35s;
  }

  .hint {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-top: 1.2rem;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Sistema Solare delle Emozioni</h1>
<p class="subtitle">Clicca sui pianeti · Modifica i nomi</p>

<div id="editor-panel">
  <h2>✦ Modifica i nomi dei pianeti</h2>
  <div class="fields-grid" id="fields-grid"></div>
  <button class="btn-update" onclick="applyNames()">Aggiorna</button>
</div>

<div id="solar-wrap">
  <svg id="solar-svg" viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<p class="hint">clicca su un pianeta per vedere gli altri · clicca di nuovo per chiudere</p>

<script>
// Configurazione pianeti: angoli ogni 60°, r=200
var defaultNames = ["Flemma","Volitività","Entusiasmo","Anaffettività","Malinc. Lunare","Malinc. Solare"];
var colors = [
  { outer:"#3C3489", inner:"#AFA9EC", stroke:"#7F77DD", text:"#CECBF6" },
  { outer:"#993C1D", inner:"#F0997B", stroke:"#D85A30", text:"#F5C4B3" },
  { outer:"#3B6D11", inner:"#97C459", stroke:"#639922", text:"#C0DD97" },
  { outer:"#444441", inner:"#B4B2A9", stroke:"#888780", text:"#D3D1C7" },
  { outer:"#0C447C", inner:"#85B7EB", stroke:"#378ADD", text:"#B5D4F4" },
  { outer:"#633806", inner:"#FAC775", stroke:"#EF9F27", text:"#FAEEDA" },
];

var cx = 300, cy = 310, r = 200;
var angles = [-90, -30, 30, 90, 150, 210];
var names = defaultNames.slice();
var current = null;

function getPos(i) {
  var a = angles[i] * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function buildFields() {
  var grid = document.getElementById('fields-grid');
  grid.innerHTML = '';
  names.forEach(function(name, i) {
    var row = document.createElement('div');
    row.className = 'field-row';
    row.innerHTML = '<label>Pianeta ' + (i+1) + '</label><input id="inp-'+i+'" type="text" value="'+name+'"/>';
    grid.appendChild(row);
  });
}

function applyNames() {
  for (var i = 0; i < 6; i++) {
    var v = document.getElementById('inp-'+i).value.trim();
    if (v) names[i] = v;
  }
  current = null;
  drawSVG();
  buildFields();
}

function togglePlanet(idx) {
  // hide all
  for (var i = 0; i < 6; i++) {
    for (var j = 0; j < 5; j++) {
      var el = document.getElementById('o-'+i+'-'+j);
      if (el) el.setAttribute('opacity','0');
    }
  }
  if (current === idx) { current = null; return; }
  current = idx;
  // show others under this planet
  var others = [];
  for (var k = 0; k < 6; k++) { if (k !== idx) others.push(names[k]); }
  var pos = getPos(idx);
  // direction: place below or above based on y position
  var above = pos.y > cy;
  for (var j = 0; j < 5; j++) {
    var el = document.getElementById('o-'+idx+'-'+j);
    if (el) el.setAttribute('opacity','1');
  }
}

function drawSVG() {
  var svg = document.getElementById('solar-svg');
  svg.innerHTML = '';

  // defs
  svg.innerHTML += '<defs></defs>';

  // orbit
  svg.innerHTML += '<circle class="orbit" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';

  // sun
  svg.innerHTML += '<circle cx="'+cx+'" cy="'+cy+'" r="54" fill="#EF9F27" opacity="0.08"/>';
  svg.innerHTML += '<circle cx="'+cx+'" cy="'+cy+'" r="38" fill="#EF9F27" opacity="0.2"/>';
  svg.innerHTML += '<circle cx="'+cx+'" cy="'+cy+'" r="24" fill="#EF9F27" opacity="0.7"/>';
  svg.innerHTML += '<circle cx="'+cx+'" cy="'+cy+'" r="16" fill="#FAC775"/>';

  // planets
  for (var i = 0; i < 6; i++) {
    var pos = getPos(i);
    var c = colors[i];
    var name = names[i];

    // compute label lines (split on space if long)
    var words = name.split(' ');
    var line1 = words[0];
    var line2 = words.slice(1).join(' ');

    // direction for "others" list
    var above = pos.y > cy; // place list above planet if planet is in bottom half
    var listStart = above ? pos.y - 36 : pos.y + 36;
    var listDir = above ? -14 : 14;

    var others = [];
    for (var k = 0; k < 6; k++) { if (k !== i) others.push(names[k]); }

    var g = '<g class="planet-g" onclick="togglePlanet('+i+')">';
    g += '<circle class="p-outer" cx="'+pos.x+'" cy="'+pos.y+'" r="28" fill="'+c.inner+'" stroke="'+c.stroke+'" stroke-width="1.2" opacity="0.95"/>';
    g += '<circle cx="'+pos.x+'" cy="'+pos.y+'" r="17" fill="'+c.outer+'" opacity="0.6"/>';

    // label inside planet
    if (line2) {
      g += '<text class="plabel" x="'+pos.x+'" y="'+(pos.y-3)+'" fill="'+c.text+'">'+line1+'</text>';
      g += '<text class="plabel" x="'+pos.x+'" y="'+(pos.y+8)+'" fill="'+c.text+'">'+line2+'</text>';
    } else {
      g += '<text class="plabel" x="'+pos.x+'" y="'+(pos.y+3)+'" fill="'+c.text+'">'+line1+'</text>';
    }

    // others list
    for (var j = 0; j < 5; j++) {
      var yy = above ? listStart - j*15 : listStart + j*15;
      g += '<text class="other-item" id="o-'+i+'-'+j+'" x="'+pos.x+'" y="'+yy+'" opacity="0">'+others[j]+'</text>';
    }

    g += '</g>';
    svg.innerHTML += g;
  }
}

// init
buildFields();
drawSVG();
</script>
</body>
</html>
